services:
  # LangGraph 2-Agent Backend Service (FastAPI)
  agent-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: agent-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./knowledge:/app/knowledge
      - ./models:/app/models
      - ./.env:/app/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Open WebUI Standalone Web Interface
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    environment:
      - OPENAI_API_BASE_URL=http://agent-backend:8000/v1
      - OPENAI_API_KEY=sk-dummy-key
      - HF_HUB_OFFLINE=1  # Prevent Open WebUI from stalling on HuggingFace downloads
    volumes:
      - ./open-webui-data:/app/backend/data
    depends_on:
      agent-backend:
        condition: service_healthy
    restart: unless-stopped
